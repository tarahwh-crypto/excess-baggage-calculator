<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>超額行李費試算工具 / Excess Baggage Fee Calculator</title>
<style>
:root[data-theme="dark"] {
--navy: #16374d;
--navy-2: #1f4a63;
--paper: #0e1b24;
--card: #16242e;
--line: #253844;
--ink: #eef3f5;
--ink-soft: #9db0ba;
--old: #8b9aa3;
--old-soft: #22303a;
--new: #6fb3d6;
--new-soft: #1a3444;
--amount: #f0a64c;
--danger: #ff7a63;
--danger-soft: #3a2420;
}
:root {
--navy: #0f2a3e;
--navy-2: #16374d;
--paper: #f5f8fa;
--card: #ffffff;
--line: #dde5ea;
--ink: #152430;
--ink-soft: #5b6b76;
--old: #7a8892;
--old-soft: #eef1f3;
--new: #2e7ea6;
--new-soft: #e7f2f7;
--amount: #d9822b;
--danger: #c0392b;
--danger-soft: #fbe9e7;

--font-display: 'Microsoft JhengHei', 'PingFang TC', -apple-system, sans-serif;
--font-body: 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Segoe UI', Roboto, sans-serif;
--font-mono: 'Microsoft JhengHei', ui-monospace, 'SF Mono', Consolas, monospace;
}

* { box-sizing: border-box; }
html,body { margin: 0; padding: 0; }
body {
background: var(--paper); color: var(--ink); font-family: var(--font-body);
-webkit-font-smoothing: antialiased; padding: 0 0 60px; line-height: 1.55;
}
.wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }

header {
background: linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
color: #fff; padding: 30px 0 42px; position: relative; overflow: hidden;
}
header::after {
content: ""; position: absolute; right: -60px; top: -60px; width: 260px; height: 260px;
border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.10), transparent 70%);
}
.header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
header .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #9fc3d6; font-weight: 700; margin: 0 0 8px; }
header h1 { font-family: var(--font-display); font-size: clamp(21px,3.6vw,28px); line-height: 1.2; margin: 0 0 8px; font-weight: 700; }
header p.sub { margin: 0; color: #c9d8e1; font-size: 13.5px; max-width: 560px; }
.lang-toggle {
flex-shrink: 0; display: flex; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
overflow: hidden; position: relative; z-index: 1;
}
.lang-toggle button {
font-family: var(--font-body); font-size: 12.5px; font-weight: 700; padding: 7px 14px; border: none;
background: transparent; color: #c9d8e1; cursor: pointer;
}
.lang-toggle button.active { background: #fff; color: var(--navy); }

main { margin-top: -22px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 20px 22px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(15,42,62,.05); }
.card h2 { font-size: 13.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); margin: 0 0 4px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card h2 .n { width: 20px; height: 20px; border-radius: 50%; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; flex: none; font-weight: 700; }
.card .hint { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 14px; }

.pillgroup { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); background: var(--card); padding: 9px 15px; border-radius: 999px; font-size: 13.5px; font-weight: 600; color: var(--ink); cursor: pointer; user-select: none; transition: all .15s ease; }
.pill input { display: none; }
.pill.active { background: var(--navy); border-color: var(--navy); color: #fff; }

details.why { margin-top: 12px; }
details.why summary { cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--new); list-style: none; display: flex; align-items: center; gap: 6px; padding: 4px 0; }
details.why summary::-webkit-details-marker { display: none; }
details.why summary::before { content: "›"; display: inline-block; transition: transform .15s ease; font-size: 15px; }
details.why[open] summary::before { transform: rotate(90deg); }
details.why .body { margin-top: 8px; font-size: 12.5px; color: var(--ink-soft); background: var(--paper); border-radius: 9px; padding: 12px 13px; }
details.why .body b { color: var(--ink); }

.flowblock { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; background: var(--paper); font-size: 12.5px; margin-top: 10px; }
.flowblock .ft { font-weight: 700; margin-bottom: 6px; color: var(--ink); }
.flowblock ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: var(--ink-soft); }
.flowblock code { font-family: var(--font-mono); background: var(--old-soft); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
input[type="date"], input[type="number"], select {
width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 10px 11px;
font-size: 14px; font-family: inherit; color: var(--ink); background: var(--card);
}
input:focus, select:focus, summary:focus-visible { outline: 2px solid var(--new); outline-offset: 1px; }

.sysbadge { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; }
.sysbadge.old { background: var(--old-soft); color: var(--ink-soft); }
.sysbadge.new { background: var(--new-soft); color: var(--new); }
.sysbadge .dot { width: 8px; height: 8px; border-radius: 50%; }
.sysbadge.old .dot { background: var(--old); }
.sysbadge.new .dot { background: var(--new); }

.routegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
@media (max-width: 520px) { .routegrid { grid-template-columns: 1fr; } }
.checkline { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink); margin-top: 10px; cursor: pointer; user-select: none; }
.checkline input { width: 16px; height: 16px; accent-color: var(--navy); }
.routeresult { margin-top: 10px; font-size: 12.5px; color: var(--ink-soft); }
.routeresult b { color: var(--ink); }
.legend { margin-top: 12px; padding: 11px 13px; background: var(--paper); border-radius: 9px; font-size: 11.5px; color: var(--ink-soft); line-height: 1.65; }
.legend b { color: var(--ink); }
.legend .footnote { display: block; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-style: italic; }

.counter-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.calc-item { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--paper); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.calc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.calc-label { font-size: 13.5px; font-weight: 700; color: var(--ink); }
.tag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: var(--old-soft); color: var(--ink-soft); }
.calc-sub { display: block; font-size: 11.5px; color: var(--ink-soft); font-weight: 400; margin-top: 4px; width: 100%; }
.stepper { display: flex; align-items: center; gap: 0; }
.stepper button { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); font-size: 16px; line-height: 1; cursor: pointer; color: var(--navy); display: flex; align-items: center; justify-content: center; }
.stepper button:active { background: var(--paper); }
.stepper .val { width: 34px; text-align: center; font-weight: 700; font-size: 14px; }

.result { background: linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%); color: #fff; position: sticky; bottom: 12px; border-radius: 14px; padding: 18px 20px; box-shadow: 0 10px 30px rgba(15,42,62,.30); }
.result .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.result .label { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: #9fc3d6; font-weight: 700; margin-bottom: 5px; }
.result .amount { font-size: clamp(26px,5.5vw,36px); font-weight: 800; font-variant-numeric: tabular-nums; color: var(--amount); }
.result .amount .cur { font-size: .45em; font-weight: 700; margin-right: 5px; color: #9fc3d6; }
.result .amount.blocked { color: var(--danger); font-size: 15px; font-weight: 700; }
.result .breakdown { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.14); display: grid; gap: 6px; font-size: 12.5px; color: #c9d8e1; }
.result .breakdown .line { display: flex; justify-content: space-between; gap: 12px; }
.result .breakdown .line b { color: #fff; font-variant-numeric: tabular-nums; }
.result .note { margin-top: 10px; font-size: 11px; color: #9fc3d6; }

.banner { display: flex; gap: 10px; align-items: flex-start; background: var(--danger-soft); border: 1px solid var(--danger); color: var(--ink); border-radius: 10px; padding: 12px 14px; font-size: 12.5px; margin-bottom: 16px; }
.banner .dot { color: var(--danger); font-weight: 700; flex-shrink: 0; }

footer { max-width: 880px; margin: 20px auto 0; padding: 0 20px; font-size: 11px; color: var(--ink-soft); line-height: 1.6; }
</style>
</head>
<body>

<header>
<div class="wrap">
<div class="header-top">
<div>
<p class="eyebrow" id="txt-eyebrow"></p>
<h1 id="txt-title"></h1>
</div>
<div class="lang-toggle" id="langToggle">

<button type="button" data-lang="en">EN</button>

</div>

</div>
</header>

<main class="wrap">

<label class="pill"><input type="radio" name="mode" value="avih"><span data-t="modeAvih"></span></label>
<label class="pill"><input type="radio" name="mode" value="sport"><span data-t="modeSport"></span></label>

</section>

<!-- STEP 1: system -->
<section class="card">

<p class="hint" id="txt-step1Hint"></p>

<div class="hint" style="margin-bottom:6px;font-weight:700;color:var(--ink)" id="txt-bagsQ"></div>
<div class="pillgroup" id="bagGroup">
<label class="pill active"><input type="radio" name="bags" value="1" checked><span data-t="bags1"></span></label>
<label class="pill"><input type="radio" name="bags" value="2"><span data-t="bags2"></span></label>
</div>

<div class="hint" style="margin:16px 0 6px;font-weight:700;color:var(--ink)" id="whichDateLabel"></div>
<p class="hint" id="whichDateHint" style="margin-bottom:10px"></p>

<div class="flowblock" id="lookupSteps"></div>

<div class="field" style="margin-top:12px">
<label for="doi" id="txt-doiLabel"></label>
<input type="date" id="doi">
</div>
<div id="sysBadgeWrap"></div>

<details class="why">
<summary id="txt-whySummary"></summary>
<div class="body" id="txt-whyBody"></div>
</details>
</section>

<!-- STEP 2: route -->
<section class="card">
<h2><span class="n">2</span><span id="txt-step2Title"></span></h2>
<p class="hint" id="routeHint"></p>
<div id="routePicker"></div>
</section>

<!-- STEP 3: mode-dependent details -->
<section class="card">
<h2><span class="n">3</span><span id="step3Title"></span></h2>
<p class="hint" id="step3Hint"></p>
<div class="counter-list" id="mainCounters"></div>
</section>

</main>

<div class="wrap"><div class="result" id="result"></div></div>

<footer class="wrap" id="txt-footer"></footer>

};
const t = (k) => STRINGS[state.lang][k];

const NEW_MATRIX = {
'TW-TW': null, 'TW-R1':150, 'TW-R2':200, 'TW-R3':220,
'R1-TW':150, 'R1-R1':170, 'R1-R2':220, 'R1-R3':240,
'R2-TW':200, 'R2-R1':220, 'R2-R2':240, 'R2-R3':260,
'R3-TW':220, 'R3-R1':240, 'R3-R2':260, 'R3-R3':280
};
const CANADA_NEW = { TW:280, R1:308, R2:337, R3:365 };
const OVERWEIGHT_MULT_TOP = { old: 2, new: 3 };

const fmt = (n) => n.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2});

// ---------- static text ----------
function renderStatic(){
document.documentElement.lang = state.lang === 'zh' ? 'zh-Hant-TW' : 'en';
document.getElementById('txt-eyebrow').textContent = t('eyebrow');
document.getElementById('txt-title').textContent = t('title');
document.getElementById('txt-sub').textContent = t('sub');
document.getElementById('txt-banner').textContent = t('banner');
document.getElementById('txt-modeTitle').textContent = t('modeTitle');
document.getElementById('txt-step1Title').textContent = t('step1Title');
document.getElementById('txt-step1Hint').textContent = t('step1Hint');
document.getElementById('txt-bagsQ').textContent = t('bagsQ');
document.getElementById('txt-doiLabel').textContent = t('doiLabel');
document.getElementById('txt-whySummary').textContent = t('whySummary');
document.getElementById('txt-whyBody').innerHTML = t('whyBody');
document.getElementById('txt-step2Title').textContent = t('step2Title');
document.getElementById('txt-footer').textContent = t('footer');
document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent = t(el.dataset.t); });
document.querySelectorAll('#langToggle button').forEach(b=>{
b.classList.toggle('active', b.dataset.lang === state.lang);
});
}

// ---------- system + date ----------
function computeSystem(){
if(!state.doi){ state.system = null; return; }
state.system = new Date(state.doi+"T00:00:00") >= CUTOFF ? 'new' : 'old';
}

function renderWhichDate(){
const label = document.getElementById('whichDateLabel');
const hint = document.getElementById('whichDateHint');
const steps = document.getElementById('lookupSteps');
const stepList = state.bags === 1 ? t('lookupOrig') : t('lookupCurrent');
label.textContent = state.bags === 1 ? t('dateLabelOrig') : t('dateLabelCurrent');
hint.textContent = state.bags === 1 ? t('dateHintOrig') : t('dateHintCurrent');
steps.innerHTML = `<div class="ft">${t('lookupTitle')}</div><ol>${stepList.map(s=>`<li>${s}</li>`).join('')}</ol>`;
}

function renderSysBadge(){
const wrap = document.getElementById('sysBadgeWrap');
if(!state.system){ wrap.innerHTML = ''; return; }
wrap.innerHTML = state.system === 'old'
? `<div class="sysbadge old"><span class="dot"></span>${t('sysOld')}</div>`
: `<div class="sysbadge new"><span class="dot"></span>${t('sysNew')}</div>`;
}

// ---------- route picker ----------
function zoneSelect(key, labelText, labelMap, current){
const opts = Object.keys(labelMap).map(k=>`<option value="${k}" ${k===current?'selected':''}>${labelMap[k]}</option>`).join('');
return `<div class="field"><label>${labelText}</label><select data-key="${key}">${opts}</select></div>`;
}
function bindZoneSelects(){
document.querySelectorAll('#routePicker select[data-key]').forEach(sel=>{
sel.addEventListener('change', e=>{ state[e.target.dataset.key] = e.target.value; calc(); });
});
}

function renderRoutePicker(){
const el = document.getElementById('routePicker');
const hint = document.getElementById('routeHint');
if(!state.system){
el.innerHTML = `<p class="hint" style="margin:0">${t('routePending')}</p>`;
hint.textContent = t('routeHintDefault');
return;
}
const OLD_ZONE_LABEL = t('oldZoneLabel');
const NEW_REGION_LABEL = t('newRegionLabel');

if(state.system === 'old'){
hint.textContent = t('routeHintOld');
el.innerHTML = `
<label class="checkline"><input type="checkbox" id="canadaOriginOld" ${state.canadaOrigin?'checked':''}> ${t('canadaOldLabel')}</label>
<div class="routegrid" id="oldZoneGrid"></div>
<p class="routeresult" id="oldZoneResult"></p>
<div class="legend">${t('oldLegend')}</div>`;
const grid = document.getElementById('oldZoneGrid');
grid.innerHTML = zoneSelect('oldOrigin', t('originLabel'), OLD_ZONE_LABEL, state.oldOrigin) + zoneSelect('oldDest', t('destLabel'), OLD_ZONE_LABEL, state.oldDest);
grid.style.opacity = state.canadaOrigin ? '.4' : '1';
grid.style.pointerEvents = state.canadaOrigin ? 'none' : 'auto';
const r = document.getElementById('oldZoneResult');
if(state.canadaOrigin){
r.innerHTML = t('routeResultCanadaFixed');
} else {
const bothZ1 = state.oldOrigin==='z1' && state.oldDest==='z1';
const bothZ2 = state.oldOrigin==='z2' && state.oldDest==='z2';
r.innerHTML = bothZ2 ? t('routeResultInvalidCombo') : (bothZ1 ? t('routeResultShort') : t('routeResultLong'));
}
document.getElementById('canadaOriginOld').addEventListener('change', e=>{ state.canadaOrigin = e.target.checked; renderRoutePicker(); calc(); });
bindZoneSelects();
} else {
hint.textContent = t('routeHintNew');
el.innerHTML = `
<label class="checkline"><input type="checkbox" id="canadaOriginNew" ${state.canadaOrigin?'checked':''}> ${t('canadaNewLabel')}</label>
<label class="checkline"><input type="checkbox" id="sydAkl" ${state.sydAkl?'checked':''}> ${t('sydAklLabel')}</label>
<div class="routegrid" id="newZoneGrid"></div>
<p class="routeresult" id="newZoneResult"></p>
<div class="legend">${t('newLegend')}<span class="footnote">${t('southAsiaNote')}</span></div>`;
const grid = document.getElementById('newZoneGrid');
const originField = state.canadaOrigin
? `<div class="field"><label>${t('originLabel')}</label><div style="padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-size:14px;color:var(--ink-soft)">${t('canadaFixedPlaceholder')}</div></div>`
: zoneSelect('newOrigin', t('originLabel'), NEW_REGION_LABEL, state.newOrigin);
grid.innerHTML = originField + zoneSelect('newDest', t('destLabel'), NEW_REGION_LABEL, state.newDest);
const destSel = grid.querySelector('select[data-key="newDest"]');
if(destSel){ destSel.style.opacity = state.sydAkl ? '.4' : '1'; destSel.style.pointerEvents = state.sydAkl ? 'none' : 'auto'; }
const r = document.getElementById('newZoneResult');
const shortLabel = (full) => full.split(state.lang==='zh' ? '（' : ' (')[0];
if(state.sydAkl){
r.textContent = t('routeResultSydAkl');
} else if(state.canadaOrigin){
r.innerHTML = t('routeResultCanadaNew')(shortLabel(NEW_REGION_LABEL[state.newDest]), CANADA_NEW[state.newDest]);
} else if(state.newOrigin==='TW' && state.newDest==='TW'){
r.innerHTML = t('routeResultTWTW');
} else {
const rate = NEW_MATRIX[`${state.newOrigin}-${state.newDest}`];
r.innerHTML = t('routeResultMatrix')(shortLabel(NEW_REGION_LABEL[state.newOrigin]), shortLabel(NEW_REGION_LABEL[state.newDest]), rate);
}
document.getElementById('canadaOriginNew').addEventListener('change', e=>{ state.canadaOrigin=e.target.checked; if(e.target.checked) state.sydAkl=false; renderRoutePicker(); calc(); });
document.getElementById('sydAkl').addEventListener('change', e=>{ state.sydAkl=e.target.checked; if(e.target.checked) state.canadaOrigin=false; renderRoutePicker(); calc(); });
bindZoneSelects();
}
}

function getOverPieceRate(){
if(!state.system) return {rate:null, currency:'USD'};
if(state.system === 'old'){
if(state.canadaOrigin) return {rate:280, currency:'CAD'};
if(state.oldOrigin==='z2' && state.oldDest==='z2') return {rate:null, currency:'USD'};
const bothZ1 = state.oldOrigin==='z1' && state.oldDest==='z1';
return {rate: bothZ1?150:200, currency:'USD'};
}
if(state.sydAkl) return {rate:50, currency:'USD'};
if(state.canadaOrigin) return {rate: CANADA_NEW[state.newDest], currency:'CAD'};
const rate = NEW_MATRIX[`${state.newOrigin}-${state.newDest}`];
return {rate: rate===undefined?null:rate, currency:'USD'};
}

// ---------- STEP 3 counters ----------
function stepperItem(key, label, tag, sub){
return `<div class="calc-item">
<div class="calc-head"><span class="calc-label">${label}</span>${tag?`<span class="tag">${tag}</span>`:''}${sub?`<span class="calc-sub">${sub}</span>`:''}</div>
<div class="stepper">
<button type="button" data-act="dec" data-key="${key}">−</button>
<span class="val" id="val-${key}">${state[key]}</span>
<button type="button" data-act="inc" data-key="${key}">+</button>
</div>
</div>`;
}
function bindSteppers(scope){
scope.querySelectorAll('button[data-key]').forEach(btn=>{
btn.addEventListener('click', ()=>{
const k = btn.dataset.key;
const delta = btn.dataset.act==='inc' ? 1 : -1;
state[k] = Math.max(0,(state[k]||0)+delta);
const v = document.getElementById('val-'+k);
if(v) v.textContent = state[k];
calc();
});
});
}

function renderCounters(){
document.getElementById('step3Title').textContent = t('modeLabel')[state.mode];
document.getElementById('step3Hint').textContent = t('step3Hint')[state.mode];
const wrap = document.getElementById('mainCounters');

if(state.mode === 'baggage'){
const owTopTag = state.system==='old' ? '×2' : (state.system==='new' ? '×3' : '×2 / ×3');
wrap.innerHTML =
stepperItem('over', t('itemOver'),'×1') +
stepperItem('ow0523', t('itemOw0523'),'×0.5') +
stepperItem('ow32', t('itemOw32'), owTopTag) +
stepperItem('os158', t('itemOs158'),'×1') +
stepperItem('os203', t('itemOs203'),'×2');
bindSteppers(wrap);
} else if(state.mode === 'avih'){
if(state.system === 'old'){
wrap.innerHTML =
stepperItem('petLe32', t('itemPetLe32'),'×2') +
stepperItem('petMid', t('itemPetMid'),'×3') +
stepperItem('petHi', t('itemPetHiOld'),'×4');
} else {
wrap.innerHTML =
stepperItem('petLe32', t('itemPetLe32'),'×2') +
stepperItem('petHi', t('itemPetHiNew'),'×4');
}
bindSteppers(wrap);
} else {
wrap.innerHTML = stepperItem('sportOver', t('itemSport'),'×2', t('itemSportSub'));
bindSteppers(wrap);
}
}

// ---------- calculation ----------
function calc(){
renderSysBadge();
renderRoutePicker();
renderCounters();

const resEl = document.getElementById('result');
if(!state.system){
resEl.innerHTML = `<div class="top"><div><div class="label">${t('resultPendingLabel')}</div><div class="amount">${t('resultPendingAmount')}</div></div></div>`;
return;
}
const {rate, currency} = getOverPieceRate();
if(rate === null){
resEl.innerHTML = `<div class="top"><div><div class="label">${t('modeLabel')[state.mode]}</div><div class="amount">${t('resultInvalidRoute')}</div></div></div>`;
return;
}

const lines = [];
let total = 0;
const add = (label, count, mult) => { if(count>0){ const amt = rate*mult*count; total += amt; lines.push({label:`${label} ×${count}`, amt}); } };

if(state.mode === 'baggage'){
add(t('itemOver'), state.over, 1);
add(t('itemOw0523'), state.ow0523, 0.5);
add(t('itemOw32'), state.ow32, OVERWEIGHT_MULT_TOP[state.system]);
add(t('itemOs158'), state.os158, 1);
add(t('itemOs203'), state.os203, 2);
} else if(state.mode === 'avih'){
add(t('itemPetLe32'), state.petLe32, 2);
if(state.system === 'old'){ add(t('itemPetMid'), state.petMid, 3); }
add(state.system==='old' ? t('itemPetHiOld') : t('itemPetHiNew'), state.petHi, 4);
} else {
add(`${t('itemSport')} (${t('itemSportSub')})`, state.sportOver, 2);
}

let html = `<div class="top"><div><div class="label">${state.system==='old'?t('oldSys'):t('newSys')} · ${t('modeLabel')[state.mode]}</div>
<div class="amount"><span class="cur">${currency}</span>${fmt(total)}</div></div></div>`;
if(lines.length){
html += `<div class="breakdown">` + lines.map(l=>`<div class="line"><span>${l.label}</span><b>${currency} ${fmt(l.amt)}</b></div>`).join('') + `</div>`;
} else {
html += `<div class="breakdown"><div class="line"><span>${t('resultEmpty')}</span><b>—</b></div></div>`;
}
html += `<div class="note">${t('resultNote')(rate, currency)}</div>`;
resEl.innerHTML = html;
}

// ---------- wire static controls ----------
document.getElementById('langToggle').addEventListener('click', (e)=>{
const btn = e.target.closest('button[data-lang]');
if(!btn || btn.dataset.lang === state.lang) return;
state.lang = btn.dataset.lang;
renderStatic();
renderWhichDate();
calc();
});

document.querySelectorAll('#modeGroup .pill').forEach(p=>{
p.addEventListener('click', ()=>{
document.querySelectorAll('#modeGroup .pill').forEach(x=>x.classList.remove('active'));
p.classList.add('active');
state.mode = p.querySelector('input').value;
calc();
});
});
document.querySelectorAll('#bagGroup .pill').forEach(p=>{
p.addEventListener('click', ()=>{
document.querySelectorAll('#bagGroup .pill').forEach(x=>x.classList.remove('active'));
p.classList.add('active');
state.bags = parseInt(p.querySelector('input').value,10);
renderWhichDate();
calc();
});
});
document.getElementById('doi').addEventListener('input', e=>{ state.doi = e.target.value; computeSystem(); calc(); });

renderStatic();
renderWhichDate();
calc();
})();
</script>

</body>
</html>
